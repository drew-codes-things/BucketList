services:
  bucketlist:
    build: ./server
    container_name: bucketlist
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      BUCKET_ADDR: 0.0.0.0:8080
      BUCKET_DATA: /data
    volumes:
      - ${BUCKET_DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:8093:8080"
